apiVersion: v1
kind: Pod
metadata:
  name: resources-limit-pod
  labels:
    name: resources-limit-pod
spec:
  containers:
  - name: apache-container
    image: httpd
    resources:
      requests:
        memory: "128Mi"
        cpu: "500m"
      limits:
        memory: "256Mi"
        cpu: "1000m"
    ports:
      - containerPort: 8080
